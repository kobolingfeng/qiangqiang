name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build, attest, and publish
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI: true
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package.json version $version"
          }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Install native dependencies
        run: bun run setup

      - name: Build release package
        run: bun run package:single

      - name: Normalize asset name and create checksum
        id: asset
        shell: pwsh
        run: |
          $source = Get-ChildItem -LiteralPath release -Filter '*-single.zip' | Select-Object -First 1
          if (-not $source) { throw 'Single-executable package was not created' }
          $asset = "release/qiangqiang-$env:RELEASE_TAG-windows-x64.zip"
          Copy-Item -LiteralPath $source.FullName -Destination $asset -Force
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$asset.sha256"
          "$hash  $(Split-Path -Leaf $asset)" | Set-Content -LiteralPath $checksum -Encoding utf8 -NoNewline
          "asset=$asset" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.asset.outputs.asset }}

      - name: Publish GitHub release
        shell: pwsh
        env:
          ASSET_PATH: ${{ steps.asset.outputs.asset }}
          CHECKSUM_PATH: ${{ steps.asset.outputs.checksum }}
        run: |
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            $env:ASSET_PATH, $env:CHECKSUM_PATH,
            '--verify-tag', '--generate-notes',
            '--title', "QiangQiang $env:RELEASE_TAG"
          )
          if ($env:RELEASE_TAG -like 'v0.*') { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
